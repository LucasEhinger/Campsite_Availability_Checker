name: Check Peddocks Island Campsites

on:
  schedule:
    # Every 20 min, 5:00am-10:59pm Eastern (EDT, UTC-4).
    # UTC hours 9-23 and 0-2 == 05:00-22:59 local; quiet 11pm-5am.
    - cron: '*/20 0-2,9-23 * * *'
  workflow_dispatch:  # allows manual run

jobs:
  check_availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # cap runaway runs so billing stays ~1 min/run

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright sendgrid
          playwright install chromium

      - name: Run Peddocks checker
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python check_peddocks.py
