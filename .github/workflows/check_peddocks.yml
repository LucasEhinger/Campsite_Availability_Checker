name: Check Peddocks Island Campsites

on:
  schedule:
    # These are only "start a watcher if one isn't already running" pokes --
    # the checks themselves happen inside the run, on the script's own timer.
    # GitHub's scheduler is best-effort and silently drops slots under load
    # (only ~15% of ours ever fired), so the run can't depend on it firing
    # every 20 minutes. Minutes avoid :00, which GitHub names as its peak
    # congestion moment. The UTC hours cover 5am-11pm Eastern in both EDT and
    # EST; check_peddocks.py enforces the real local window.
    - cron: '5,25,45 0-4,9-23 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email instead of checking availability'
        type: boolean
        default: false

# One watcher at a time. A run triggered while another is polling waits its
# turn instead of piling up, then starts the moment that one exits -- so
# coverage carries over even though most cron slots never fire.
# cancel-in-progress must stay false: cancelling would kill the running
# watcher before the cache step saves, losing the "already emailed" list.
concurrency:
  group: peddocks-watcher
  cancel-in-progress: false

jobs:
  check_availability:
    runs-on: ubuntu-latest
    # The watcher polls for --max-minutes (330) and needs room to finish and
    # save its cache; GitHub's ceiling for a hosted job is 360.
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Carries the "already emailed" list between runs so the same opening
      # doesn't alert twice. Key is unique per run; restore-keys pulls the
      # most recent previous save.
      - name: Restore alert history
        uses: actions/cache@v4
        with:
          path: .peddocks_state.json
          key: peddocks-state-${{ github.run_id }}
          restore-keys: |
            peddocks-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Peddocks checker
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        # -u so a multi-hour run streams its log instead of buffering it.
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python -u check_peddocks.py --test-email
          else
            python -u check_peddocks.py --watch
          fi
